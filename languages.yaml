        CHECK_AGAIN: 'Erneut prüfen'
        CHECKING: 'Wird geprüft…'
        REPORTS_ENV_OFF: 'Die Umgebungsvariable SUPERTEXT_VERSION_REPORTS={value} schaltet die Versionsinformationen aus, unabhängig von der Einstellung unten.'
        REPORTS_ENV_ON: 'Die Umgebungsvariable SUPERTEXT_VERSION_REPORTS={value} schaltet die Versionsinformationen ein, unabhängig von der Einstellung unten.'
        LOAD_ERROR: 'Der Supertext-Status konnte nicht geladen werden ({error}). Aktivieren Sie das Plugin, speichern Sie die Einstellungen und laden Sie diese Seite neu.'
        LANG_SOURCE: 'Ausgangssprache, gesendet als {code}'
        LANG_CHOOSE: '— wählen —'
        LANG_NOT_MAPPED: 'Nicht zugeordnet: Supertext hat keinen Standard für {code}. Wählen Sie eine Supertext-Sprache, sonst kann in diese Sprache nicht übersetzt werden.'
        LANG_DEFAULT: 'Standard für {code}: Wählen Sie eine andere Supertext-Sprache, wenn Sie eine andere Variante meinen.'
        LANG_NO_POLITENESS: 'Supertext bietet für diese Sprache keine formelle oder informelle Anrede an: Es gilt die Standard-Anrede von Supertext.'
        LANG_OTHER: '{code} (nicht in der Liste)'
        LANG_UNAVAILABLE: 'Aktivieren Sie das Plugin und laden Sie diese Seite neu, um die Sprachen zu wählen.'
        LANG_REVIEW: Übersetzungsprüfung
        LANG_REVIEW_HELP: 'Übersetzungen in diese Sprache laufen über den Prüfdienst von Supertext, damit Prüferinnen und Prüfer sie mit der Erweiterung Supertext Localization Review direkt auf der Website kontrollieren und korrigieren können. Ihre Korrekturen werden beim nächsten Übersetzen der Seite übernommen.'
        LANG_REVIEW_OFF: 'Die Übersetzungsprüfung ist für alle Sprachen ausgeschaltet: Die Einstellung Prüfdienst ist leer.'
fr:
  PLUGIN_SUPERTEXT_TRANSLATION:
    PANEL_LABEL: Traduction Supertext
    SETTINGS:
      PLUGIN_STATUS: Statut du plugin
      ENABLED: Activé
      DISABLED: Désactivé
      SECTION_ACCOUNT: Compte Supertext
      API_KEY: Clé API
      API_KEY_HELP: Votre clé API Supertext. Vous pouvez la coller avec ou sans le préfixe "Supertext-Auth-Key". Laissez vide pour utiliser la variable d’environnement SUPERTEXT_API_KEY.
      API_KEY_DESCRIPTION: Pas encore de compte Supertext ? <a href="https://www.supertext.com/person/en/account/signin" target="_blank" rel="noopener noreferrer">Créez-en un sur supertext.com</a>. Générez votre clé API sur <a href="https://www.supertext.com/en/integrations/api" target="_blank" rel="noopener noreferrer">supertext.com → Integrations → API</a> (rôle Admin requis).
      API_URL: Point d’accès de l’API
      API_URL_HELP: Ne modifiez cette valeur que si Supertext vous indique un autre point d’accès.
      REVIEW_URL: Service de révision
      REVIEW_URL_HELP: 'Adresse du service de révision de Supertext pour les langues avec la révision des traductions. Laissez ce champ vide pour désactiver la révision pour toutes les langues. Ne modifiez cette valeur que si Supertext vous indique une autre adresse.'
      KEY_CHECK: 'Vérification de la clé API'
      VERSION_REPORTS: 'Envoyer les informations de version à Supertext'
      VERSION_REPORTS_HELP: 'Envoie à Supertext l’URL du site ainsi que les versions de ce plugin, du CMS et de l’environnement d’exécution lorsque vous enregistrez ces paramètres et après une mise à jour. Le support Supertext voit ainsi quelle version vous utilisez. Aucun contenu, aucune clé API et aucune donnée personnelle ne sont transmis.'
      SECTION_LANGUAGES: Langues
      SOURCE_LANGUAGE: Langue source
      SOURCE_LANGUAGE_PLACEHOLDER: Langue par défaut du site
      SOURCE_LANGUAGE_HELP: Code de langue Grav à partir duquel les traductions sont faites, par ex. "en". Vide signifie la langue par défaut du site.
      LANGUAGE_CODES: Codes de langue Supertext
      LANGUAGE_CODES_HELP: 'La langue Supertext vers laquelle et depuis laquelle chaque langue du site est traduite. Chaque langue est présélectionnée avec son code Supertext (es, nl, de-CH) ou sa valeur par défaut (de → de-DE, en → en-US, fr → fr-FR, it → it-IT, pt → pt-PT, zh → zh-Hans) ; choisissez une autre variante si c’est celle que vous voulez, par exemple fr-CH pour le français de Suisse. Une langue sans valeur par défaut (en-IE, de-LI, gsw) affiche — choisir — et ne peut être traduite qu’une fois une langue choisie.'
      POLITENESS: Forme d’adresse
      POLITENESS_DEFAULT: Valeur par défaut de Supertext
      POLITENESS_MORE: Formel (Sie, vous)
      POLITENESS_LESS: Informel (du, tu)
      POLITENESS_HELP: 'S’applique uniquement aux langues pour lesquelles Supertext propose une forme formelle et une forme informelle. Les autres reçoivent toujours la valeur par défaut de Supertext.'
      SECTION_CONTENT: Ce qui est traduit
      HEADER_FIELDS: Champs du front matter
      HEADER_FIELDS_HELP: Champs du front matter traduits avec le contenu de la page. Utilisez des points pour les champs imbriqués, par ex. metadata.description.
      PUBLISH: Publier les nouvelles traductions
      PUBLISH_YES: Publier immédiatement
      PUBLISH_NO: Créer non publiées pour relecture
      SECTION_ADVANCED: Avancé
      POLL_INTERVAL: Intervalle de vérification du statut (secondes)
      POLL_TIMEOUT: Attente maximale (secondes)
    ERRORS:
      CHOOSE_LANGUAGE: Choisissez au moins une langue.
      UNKNOWN_LANGUAGES: 'Langue inexistante sur ce site : %s'
      ONE_LANGUAGE: Ce site n’a qu’une seule langue. Ajoutez d’abord des langues sous Configuration → Système → Langues.
      ROUTE_MISSING: La route de la page est manquante.
      PAGE_NOT_FOUND: 'Page introuvable : %s'
      NO_API_KEY: Aucune clé API Supertext n’est configurée. Un administrateur peut l’ajouter dans les paramètres du plugin. Pas encore de compte Supertext ? Créez-en un sur https://www.supertext.com/person/en/account/signin. Générez votre clé API sur https://www.supertext.com/en/integrations/api (rôle Admin requis).
      AUTH_FAILED: Supertext a refusé la clé API. Veuillez la vérifier dans les paramètres du plugin. Pas encore de compte Supertext ? Créez-en un sur https://www.supertext.com/person/en/account/signin. Générez votre clé API sur https://www.supertext.com/en/integrations/api (rôle Admin requis).
      NO_CURL: L’extension PHP curl est nécessaire pour joindre Supertext.
      UNREACHABLE: 'Impossible de joindre Supertext : %s'
      TOO_LONG: La page est trop longue pour être traduite en une seule fois.
      TRANSLATION_FAILED: Supertext n’a pas pu traduire la page.
      LIMIT_EXCEEDED: Votre limite de traduction Supertext est atteinte.
      DELETED: Le fichier a été supprimé chez Supertext avant que la traduction puisse être téléchargée.
      EMPTY: Supertext a renvoyé une traduction vide.
      TIMEOUT: Supertext a mis trop de temps à répondre. Veuillez réessayer.
      NO_RESULT: Aucune traduction n’a été renvoyée.
      NO_FILE_ID: Supertext n’a pas accepté la page (aucun identifiant de fichier renvoyé).
      INVALID_LANGUAGE_PAIR: 'Supertext ne traduit pas de %s vers %s. Vérifiez les codes de langue Supertext dans les réglages du plugin.'
      NOT_FOUND: Supertext n’a pas trouvé le fichier demandé.
      RATE_LIMITED: Supertext est occupé (trop de requêtes). Veuillez réessayer dans un instant.
      UNAVAILABLE: Le service Supertext est actuellement indisponible. Veuillez réessayer plus tard.
      HTTP_ERROR: Supertext a répondu avec le code HTTP %d.
      NO_SOURCE: Cette page n’a pas de version %s à partir de laquelle traduire.
      NO_TEXT: Cette page n’a pas de texte à traduire.
      KEPT_EDITED: La traduction a été modifiée après avoir été traduite. Elle a été conservée ; confirmez pour la remplacer.
      KEPT_MANUAL: Une traduction qui n’a pas été faite avec Supertext existe déjà. Elle a été conservée ; confirmez pour la remplacer.
      PARTLY_UNTRANSLATED: '%d blocs de texte sur %d sont revenus non traduits et ont été conservés dans la langue source.'
      UNSUPPORTED_LANGUAGE: 'La langue %s n’est encore associée à aucune langue Supertext. Demandez à votre administrateur de l’associer sous Plugins → Supertext Translation → Codes de langue Supertext.'
      UNSUPPORTED_FEATURE: 'Supertext ne propose pas de ton formel ou informel pour cette langue. Réglez la forme d’adresse sur « Valeur par défaut de Supertext » dans les paramètres du plugin.'
      FILE_HTML_ONE_LANGUAGE: 'Un fichier HTML contient exactement une langue. Choisissez une seule langue ou XLIFF.'
      FILE_NOTHING: 'Rien à traduire.'
      FILE_NO_UPLOAD: 'Veuillez choisir un fichier.'
      FILE_TOO_LARGE: 'Le fichier est trop volumineux (10 Mo au maximum).'
      FILE_INVALID_FILE: 'Ce fichier n’est pas un fichier de traduction XLIFF ou HTML valide.'
      FILE_MISSING_METADATA: 'Ce fichier n’a pas été exporté par le plugin Supertext, ou son en-tête a été supprimé.'
      FILE_OTHER_SYSTEM: 'Ce fichier appartient à un autre système (%s).'
      FILE_NOT_FOUND: 'La page à partir de laquelle ce fichier a été exporté n’existe plus.'
      FILE_NO_LANGUAGE: 'Le site n’a pas de langue %s.'
      FILE_FORBIDDEN: 'Vous n’êtes pas autorisé à modifier cette page.'
