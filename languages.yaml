      FILE_HTML_ONE_LANGUAGE: 'Eine HTML-Datei enthält genau eine Sprache. Wählen Sie eine Sprache oder XLIFF.'
      FILE_NOTHING: 'Nichts zu übersetzen.'
      FILE_NO_UPLOAD: 'Bitte wählen Sie eine Datei.'
      FILE_TOO_LARGE: 'Die Datei ist zu gross (höchstens 10 MB).'
      FILE_INVALID_FILE: 'Diese Datei ist keine gültige XLIFF- oder HTML-Übersetzungsdatei.'
      FILE_MISSING_METADATA: 'Diese Datei wurde nicht vom Supertext-Plugin exportiert, oder ihr Kopfbereich wurde entfernt.'
      FILE_OTHER_SYSTEM: 'Diese Datei gehört zu einem anderen System (%s).'
      FILE_NOT_FOUND: 'Die Seite, aus der diese Datei exportiert wurde, existiert nicht mehr.'
      FILE_NO_LANGUAGE: 'Die Website hat keine Sprache %s.'
