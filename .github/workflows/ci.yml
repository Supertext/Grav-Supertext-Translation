name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, mbstring
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: Lint PHP
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Check panel script
        run: node --check admin-next/panels/supertext-translation.js
      - run: composer test

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    env:
      # Same Grav + Admin2 release as the demo (demo/Dockerfile).
      GRAV_VERSION: 2.2.4
      PHPSTAN_VERSION: 2.3.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: curl, dom, mbstring
          coverage: none
          tools: phpstan:${{ env.PHPSTAN_VERSION }}
      - name: Unpack Grav (core and the API plugin) into .grav/
        run: |
          curl -fsSL -o grav.zip "https://github.com/getgrav/grav/releases/download/${GRAV_VERSION}/grav-admin-v${GRAV_VERSION}.zip"
          mkdir .grav && unzip -q grav.zip -d .grav && rm grav.zip
      - run: phpstan analyse --no-progress --error-format=github
