name: Supertext Translation
slug: supertext-translation
type: plugin
version: 0.1.0
description: Translate pages into your site's other languages with Supertext AI translation, from the page editor of Admin2.
icon: language
author:
  name: Supertext
  email: support@supertext.com
  url: https://www.supertext.com
homepage: https://github.com/Supertext/Grav-Supertext-Translation
keywords: translation, multilanguage, supertext, ai, localization
bugs: https://github.com/Supertext/Grav-Supertext-Translation/issues
docs: https://github.com/Supertext/Grav-Supertext-Translation/blob/main/docs/INSTALLATION.md
license: MIT
compatibility:
  grav: ['2.0']

dependencies:
  - { name: grav, version: '>=2.1.5' }
  - { name: api, version: '>=1.0.44' }
  - { name: admin2, version: '>=2.1.0' }

form:
  validation: loose
  fields:
    enabled:
      type: toggle
      label: PLUGIN_SUPERTEXT_TRANSLATION.SETTINGS.PLUGIN_STATUS
      highlight: 1
      default: 1
      options:
        1: PLUGIN_SUPERTEXT_TRANSLATION.SETTINGS.ENABLED
        0: PLUGIN_SUPERTEXT_TRANSLATION.SETTINGS.DISABLED
      validate:
        type: bool

    connection:
      type: section
      title: PLUGIN_SUPERTEXT_TRANSLATION.SETTINGS.SECTION_ACCOUNT
      underline: true

    api_key:
      type: password
      label: PLUGIN_SUPERTEXT_TRANSLATION.SETTINGS.API_KEY
      autocomplete: off
      help: PLUGIN_SUPERTEXT_TRANSLATION.SETTINGS.API_KEY_HELP
      markdown: true
      description: PLUGIN_SUPERTEXT_TRANSLATION.SETTINGS.API_KEY_DESCRIPTION
      validate:
        max: 1024

    api_url:
      type: text
      label: PLUGIN_SUPERTEXT_TRANSLATION.SETTINGS.API_URL
      default: 'https://api.supertext.com/v1/'
      help: PLUGIN_SUPERTEXT_TRANSLATION.SETTINGS.API_URL_HELP

    languages_section:
      type: section
      title: PLUGIN_SUPERTEXT_TRANSLATION.SETTINGS.SECTION_LANGUAGES
      underline: true

    source_language:
      type: text
      label: PLUGIN_SUPERTEXT_TRANSLATION.SETTINGS.SOURCE_LANGUAGE
      placeholder: PLUGIN_SUPERTEXT_TRANSLATION.SETTINGS.SOURCE_LANGUAGE_PLACEHOLDER
      help: PLUGIN_SUPERTEXT_TRANSLATION.SETTINGS.SOURCE_LANGUAGE_HELP

    language_codes:
      type: array
      label: PLUGIN_SUPERTEXT_TRANSLATION.SETTINGS.LANGUAGE_CODES
      placeholder_key: PLUGIN_SUPERTEXT_TRANSLATION.SETTINGS.LANGUAGE_CODES_KEY
      placeholder_value: PLUGIN_SUPERTEXT_TRANSLATION.SETTINGS.LANGUAGE_CODES_VALUE
      help: PLUGIN_SUPERTEXT_TRANSLATION.SETTINGS.LANGUAGE_CODES_HELP

    politeness:
      type: select
      label: PLUGIN_SUPERTEXT_TRANSLATION.SETTINGS.POLITENESS
      default: default
      options:
        default: PLUGIN_SUPERTEXT_TRANSLATION.SETTINGS.POLITENESS_DEFAULT
        more: PLUGIN_SUPERTEXT_TRANSLATION.SETTINGS.POLITENESS_MORE
        less: PLUGIN_SUPERTEXT_TRANSLATION.SETTINGS.POLITENESS_LESS
      help: PLUGIN_SUPERTEXT_TRANSLATION.SETTINGS.POLITENESS_HELP

    content_section:
      type: section
      title: PLUGIN_SUPERTEXT_TRANSLATION.SETTINGS.SECTION_CONTENT
      underline: true

    header_fields:
      type: selectize
      label: PLUGIN_SUPERTEXT_TRANSLATION.SETTINGS.HEADER_FIELDS
      default: [title, menu, metadata.description]
      help: PLUGIN_SUPERTEXT_TRANSLATION.SETTINGS.HEADER_FIELDS_HELP
      validate:
        type: commalist

    publish_new_translations:
      type: toggle
      label: PLUGIN_SUPERTEXT_TRANSLATION.SETTINGS.PUBLISH
      default: 0
      highlight: 0
      options:
        1: PLUGIN_SUPERTEXT_TRANSLATION.SETTINGS.PUBLISH_YES
        0: PLUGIN_SUPERTEXT_TRANSLATION.SETTINGS.PUBLISH_NO
      validate:
        type: bool

    advanced_section:
      type: section
      title: PLUGIN_SUPERTEXT_TRANSLATION.SETTINGS.SECTION_ADVANCED
      underline: true

    poll_interval:
      type: number
      label: PLUGIN_SUPERTEXT_TRANSLATION.SETTINGS.POLL_INTERVAL
      default: 2
      validate:
        type: int
        min: 1
        max: 30

    poll_timeout:
      type: number
      label: PLUGIN_SUPERTEXT_TRANSLATION.SETTINGS.POLL_TIMEOUT
      default: 300
      validate:
        type: int
        min: 10
        max: 1800
