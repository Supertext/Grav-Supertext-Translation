enabled: true

# Supertext API key. Leave empty to use the SUPERTEXT_API_KEY environment variable.
# The key can be pasted with or without its "Supertext-Auth-Key " prefix.
api_key: ''

# Supertext AI file translation API v1.
api_url: 'https://api.supertext.com/v1/'

# Language the translations are made from. Empty = the site's default language.
source_language: ''

# Which Supertext language each Grav language is. Without an entry, the Grav code is used
# only if it is exactly a Supertext code ("de-ch" → de-CH, "es" → es); a bare "de" or "fr"
# needs an entry, because only you know the variant. Example: { de: de-CH, fr: fr-CH, en: en-GB }
language_codes: {}

# Formal or informal address in languages that have it: default, more (formal), less (informal).
# Targets without the choice (en-US, en-GB, rm, sq, …) always get Supertext's default.
politeness: default

# Front matter fields translated together with the page content (dot paths).
header_fields:
  - title
  - menu
  - metadata.description

# New translations are created unpublished, so an editor can review them first.
publish_new_translations: false

# Send the site URL and the plugin, Grav and PHP versions to Supertext (Commando Center) when
# the settings are saved and after an update. No content, no API key, no personal data.
# The environment variable SUPERTEXT_VERSION_REPORTS=0 turns it off as well.
version_reports: true

# Seconds between status checks, and how long to wait for Supertext in total.
poll_interval: 2
poll_timeout: 300
